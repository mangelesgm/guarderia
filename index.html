<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Video e Imagen</title>

    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Nosifer&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <video autoplay muted loop id="fondo">
        <source src="payaso.mp4" type="video/mp4">
    </video>

   
    <div class="container">
        <div class="content">
            <h1>JUEGA O MUERE</h1>
            <p>Jugaré, no abandonaré</p>
            <button id="playVideoButton">CONTINUAR</button>
        </div>
<!-- Audio de fondo -->
           <audio id="background-audio" src="risa.mp3" loop> 
            </audio>
        <div id="videoContainer" class="hidden">
            <video id="video" width="640" height="360" playsinline>
                <source src="video/halloween.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
        </div>
  
        <div id="imageButtonContainer" class="hidden">
            <button id="showImageButton">PISTA</button>
        </div>

        <div id="imageContainer" class="hidden">
            <img id="image" src="img/guarderia.jpg" alt="Imagen">
            <a href="https://maps.app.goo.gl/dtzM6LuNfMkt79mW9">
            <button id="ubicacion">UBICACIÓN</button></a>
        </div>
    </div>

    <script src="js/script.js">
    
    </script>
</body>
</html>
